baseURL: /
title: N42 Gateway

contentDir: content/en
disableKinds: [taxonomy,term,rss]
enableRobotsTXT: true
enableGitInfo: true

security:
  allowContent: ['.*'] ## TODO: still using .html in /content

module:
  hugoVersion:
    extended: true
    min: 0.161.0
  imports:
  - path: github.com/google/docsy

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    # required for dark mode, fix color scheme of syntax highlight outputs
    noClasses: false

imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: smart

params:
  description: "Ingress controller implementation for HAProxy load balancer"
  github_repo: https://github.com/n42-gateway/n42-gateway
  github_subdir: docs
  github_branch: master
  copyright:
    authors: The N42 Gateway Authors
    trademark: HAProxy is a registered trademark of HAProxy Technologies SAS.
    from_year: 2017
    image:
      author_name: Sergei Starostin
      author_url: "https://www.pexels.com/@sejio402/"
      provider_name: Pexels
      provider_url: "https://www.pexels.com/photo/grayscale-photo-of-a-circuit-board-6477212/"
  ui:
    navbar_logo: true
    breadcrumb_disable: false
    sidebar_menu_compact: false
    sidebar_search_disable: false
    footer_about_enable: true
    showLightDarkModeMenu: true
    feedback:
      enable: false
    readingtime:
      enable: false
  version_menu: "v0.16"
  versions:
  - version: "Latest"
    url: "/docs"
  - version: "v0.16"
    url: "/v0.16/docs"
  - version: "v0.15"
    url: "/v0.15/docs"
  - version: "v0.14"
    url: "/v0.14/docs"
  - version: "v0.13"
    url: "/v0.13/docs"
  - version: "v0.12"
    url: "/v0.12/docs"
  - version: "v0.10"
    url: "/v0.10/docs"
  links:
    user:
    - name: "Slack"
      url: "https://kubernetes.slack.com/channels/n42-gateway"
      icon: "fab fa-slack"
      desc: "We're in the #n42-gateway channel on Kubernetes Slack. Invites at https://slack.k8s.io if not subscribed."
    - name: "Discussions"
      url: "https://github.com/n42-gateway/n42-gateway/discussions"
      icon: "fa fa-envelope"
      desc: "Announcements and Q&A on GitHub Discussions"
    developer:
    - name: "GitHub"
      url: "https://github.com/n42-gateway/n42-gateway"
      icon: "fab fa-github"
      desc: "Development takes place here!"
