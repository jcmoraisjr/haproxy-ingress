name: image
on:
  push:
    tags:
    - '*'
jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      EXTRA_TAGS: snapshot
    steps:
    - name: Configure envvars
      run: |
        GIT_TAG="${GITHUB_REF#refs/tags/}"
        TAGS=$(
          for repository in ghcr.io/n42-gateway quay.io/n42-gateway; do
            for project in n42-gateway; do
              for tag in "$GIT_TAG" ${{ env.EXTRA_TAGS }}; do
                echo -n "${repository}/${project}:${tag},"
              done
            done
          done
        )
        echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
        echo "TAGS=$TAGS" >> $GITHUB_ENV
    - uses: actions/checkout@v6
    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ secrets.GITHUB_ACTOR }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_N42_USR }}
        password: ${{ secrets.QUAY_N42_PWD }}
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: .
        file: builder/Dockerfile
        platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/s390x
        push: true
        build-args: |
          GIT_TAG=${{ env.GIT_TAG }}
        tags: ${{ env.TAGS }}
